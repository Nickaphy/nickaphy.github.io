<!--
  Shared site header.
  {{ root }} = relative path prefix to the site root ("" or "../").
  {{ nav_home|projects|writeups|contact }} = optional aria-current="page".
-->
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{{ root }}">nickaphy</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ root }}"{{ nav_home }}>Home</a>
      <a href="{{ root }}projects/"{{ nav_projects }}>Projects</a>
      <a href="{{ root }}writeups/"{{ nav_writeups }}>Writeups</a>
      <a href="{{ root }}#contact"{{ nav_contact }}>Contact</a>
    </nav>
  </div>
</header>
